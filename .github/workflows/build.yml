name: Build C++ Module

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential g++ python3-dev
        pip install pybind11 setuptools wheel
    
    - name: Build C++ module
      run: |
        python setup.py build_ext --inplace
    
    - name: Upload compiled module
      uses: actions/upload-artifact@v3
      with:
        name: cpp-module
        path: calc_backend*.so
    
    - name: Commit compiled module
      run: |
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'
        git add calc_backend*.so
        git commit -m "Add compiled C++ module" || echo "No changes to commit"
        git push
