services:
  - type: web
    name: math-core-3000
    env: python
    buildCommand: |
      apt-get update && apt-get install -y build-essential g++ python3-dev
      pip install -e .
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
